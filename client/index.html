<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qwen3 Voice Assistant</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0f0f0f;
      color: #eee;
    }
    h1 { font-size: 1.4rem; margin-bottom: 2rem; }
    #btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      background: #1e88e5;
      color: white;
      transition: background 0.2s, transform 0.1s;
    }
    #btn:active { transform: scale(0.95); }
    #btn.active { background: #e53935; }
    #btn:disabled { background: #444; cursor: default; }
    #status { margin-top: 1.5rem; font-size: 0.9rem; color: #aaa; }
    #transcript {
      margin-top: 1.5rem;
      width: min(480px, 90vw);
      height: 160px;
      overflow-y: auto;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #transcript .turn { line-height: 1.5; }
    #transcript .turn .role { font-weight: 600; margin-right: 6px; }
    #transcript .turn.user .role     { color: #4fc3f7; }
    #transcript .turn.assistant .role { color: #ffb74d; }
    #transcript .turn .text { color: #ddd; }
    #log {
      margin-top: 0.75rem;
      width: min(480px, 90vw);
      height: 160px;
      overflow-y: auto;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.75rem;
      font-family: monospace;
      color: #ccc;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #log .entry { line-height: 1.4; }
    #log .entry .ts { color: #555; margin-right: 6px; }
    #log .entry.ttfc { color: #4fc3f7; }
    #log .entry.stt  { color: #fff59d; }
    #log .entry.llm  { color: #ce93d8; }
    #log .entry.tts  { color: #ffb74d; }
    #log .entry.rtf  { color: #a5d6a7; }
  </style>
</head>
<body>
  <h1>Qwen3 Voice Assistant</h1>
  <button id="btn" title="Start / Stop">🎤</button>
  <div id="status">Click to start</div>
  <div id="transcript"></div>
  <div id="log"></div>
  <audio id="audio" autoplay></audio>

<script>
const btn          = document.getElementById('btn');
const status       = document.getElementById('status');
const audio        = document.getElementById('audio');
const logEl        = document.getElementById('log');
const transcriptEl = document.getElementById('transcript');

const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
];

let pc        = null;
let dc        = null;
let pcId      = null;
let pingTimer = null;

btn.addEventListener('click', () => {
  if (pc) stop(); else start();
});

async function start() {
  btn.disabled = true;
  setStatus('Requesting microphone…');

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (e) {
    setStatus('Microphone access denied: ' + e.message);
    btn.disabled = false;
    return;
  }

  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  pc.addTransceiver(stream.getAudioTracks()[0], { direction: 'sendrecv' });
  pc.addTransceiver('video', { direction: 'recvonly' });

  dc = pc.createDataChannel('pipecat');

  dc.addEventListener('open', () => {
    pingTimer = setInterval(() => {
      if (dc.readyState === 'open') dc.send('ping');
    }, 2000);
  });

  dc.addEventListener('message', (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg?.type === 'signalling' && msg?.message?.type === 'renegotiate') {
        renegotiate();
      } else if (msg?.type === 'log') {
        appendLog(msg.msg);
      } else if (msg?.type === 'transcript') {
        appendTranscript(msg.role, msg.text);
      }
    } catch (_) {}
  });

  pc.addEventListener('track', (e) => {
    if (e.track.kind === 'audio') {
      audio.srcObject = new MediaStream([e.track]);
    }
  });

  pc.addEventListener('connectionstatechange', () => {
    const s = pc.connectionState;
    setStatus(s.charAt(0).toUpperCase() + s.slice(1));
    if (s === 'failed' || s === 'closed') cleanup();
  });

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  setStatus('Connecting…');
  await waitForIceGathering(pc);

  let resp;
  try {
    resp = await fetch('/offer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type }),
    });
  } catch (e) {
    setStatus('Server unreachable: ' + e.message);
    cleanup();
    return;
  }

  if (!resp.ok) { setStatus('Server error ' + resp.status); cleanup(); return; }

  const answer = await resp.json();
  pcId = answer.pc_id;
  await pc.setRemoteDescription({ sdp: answer.sdp, type: answer.type });

  btn.textContent = '⏹';
  btn.classList.add('active');
  btn.disabled = false;
  setStatus('Connected — speak now');
}

async function renegotiate() {
  if (!pc) return;
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await waitForIceGathering(pc);

  const resp = await fetch('/offer', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      sdp: pc.localDescription.sdp,
      type: pc.localDescription.type,
      pc_id: pcId,
    }),
  });
  if (!resp.ok) return;
  const answer = await resp.json();
  await pc.setRemoteDescription({ sdp: answer.sdp, type: answer.type });
}

function stop() {
  if (dc && dc.readyState === 'open') {
    dc.send(JSON.stringify({ type: 'signalling', message: { type: 'peerLeft' } }));
  }
  cleanup();
}

function cleanup() {
  clearInterval(pingTimer); pingTimer = null;
  if (pc) { pc.close(); pc = null; }
  dc = null; pcId = null;
  audio.srcObject = null;
  btn.textContent = '🎤';
  btn.classList.remove('active');
  btn.disabled = false;
  setStatus('Click to start');
}

function setStatus(msg) { status.textContent = msg; }

function appendTranscript(role, text) {
  const row = document.createElement('div');
  row.className = 'turn ' + role;
  row.innerHTML = `<span class="role">${role === 'user' ? 'You' : 'AI'}:</span><span class="text">${text}</span>`;
  transcriptEl.appendChild(row);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

function appendLog(msg) {
  const ts  = new Date().toTimeString().slice(0, 8);
  const cls = msg.startsWith('TTFC') ? 'ttfc'
            : msg.startsWith('RTF')  ? 'rtf'
            : msg.startsWith('STT')  ? 'stt'
            : msg.startsWith('LLM')  ? 'llm'
            : msg.startsWith('TTS')  ? 'tts'
            : '';
  const row = document.createElement('div');
  row.className = 'entry' + (cls ? ' ' + cls : '');
  row.innerHTML = `<span class="ts">${ts}</span>${msg}`;
  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
}

function waitForIceGathering(pc) {
  return new Promise(resolve => {
    if (pc.iceGatheringState === 'complete') { resolve(); return; }
    const check = () => {
      if (pc.iceGatheringState === 'complete') {
        pc.removeEventListener('icegatheringstatechange', check);
        resolve();
      }
    };
    pc.addEventListener('icegatheringstatechange', check);
    setTimeout(resolve, 3000);
  });
}
</script>
</body>
</html>
