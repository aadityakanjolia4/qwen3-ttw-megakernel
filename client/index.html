<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qwen3 Voice Assistant</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0f0f0f;
      color: #eee;
    }
    h1 { font-size: 1.4rem; margin-bottom: 2rem; }
    #btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: none;
      font-size: 2rem;
      cursor: pointer;
      background: #1e88e5;
      color: white;
      transition: background 0.2s, transform 0.1s;
    }
    #btn:active { transform: scale(0.95); }
    #btn.active { background: #e53935; }
    #btn:disabled { background: #444; cursor: default; }
    #status { margin-top: 1.5rem; font-size: 0.9rem; color: #aaa; }
    #transcript {
      margin-top: 1.5rem;
      width: min(480px, 90vw);
      height: 160px;
      overflow-y: auto;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    #transcript .turn { line-height: 1.5; }
    #transcript .turn .role { font-weight: 600; margin-right: 6px; }
    #transcript .turn.user .role     { color: #4fc3f7; }
    #transcript .turn.assistant .role { color: #ffb74d; }
    #transcript .turn .text { color: #ddd; }
    #log {
      margin-top: 0.75rem;
      width: min(480px, 90vw);
      height: 120px;
      overflow-y: auto;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.75rem;
      font-family: monospace;
      color: #ccc;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #log .entry { line-height: 1.4; }
    #log .entry .ts { color: #555; margin-right: 6px; }
    #log .entry.stt { color: #fff59d; }
    #log .entry.llm { color: #ce93d8; }
    #log .entry.tts { color: #ffb74d; }
    #log .entry.ttfc { color: #4fc3f7; }
    #log .entry.rtf  { color: #a5d6a7; }
  </style>
</head>
<body>
  <h1>Qwen3 Voice Assistant</h1>
  <button id="btn" title="Start / Stop">🎤</button>
  <div id="status">Click to start</div>
  <div id="transcript"></div>
  <div id="log"></div>

<script>
const btn          = document.getElementById('btn');
const statusEl     = document.getElementById('status');
const transcriptEl = document.getElementById('transcript');
const logEl        = document.getElementById('log');

const SAMPLE_RATE  = 16000;
const CHUNK_MS     = 20;          // send 20 ms PCM chunks
const CHUNK_FRAMES = SAMPLE_RATE * CHUNK_MS / 1000;  // 320 samples

// AudioWorklet processor source (inlined as blob URL)
const WORKLET_SRC = `
class CaptureProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this._buf = new Float32Array(${CHUNK_FRAMES});
    this._pos = 0;
  }
  process(inputs) {
    const ch = inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      this._buf[this._pos++] = ch[i];
      if (this._pos === ${CHUNK_FRAMES}) {
        this.port.postMessage(this._buf.slice());
        this._pos = 0;
      }
    }
    return true;
  }
}
registerProcessor('capture-processor', CaptureProcessor);
`;

let ws           = null;
let audioCtx     = null;
let workletNode  = null;
let micSource    = null;
let micStream    = null;
let playTime     = 0;     // next scheduled play time in audioCtx seconds

btn.addEventListener('click', () => {
  if (ws) stop(); else start();
});

async function start() {
  btn.disabled = true;
  setStatus('Requesting microphone…');

  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (e) {
    setStatus('Microphone denied: ' + e.message);
    btn.disabled = false;
    return;
  }

  // Audio context locked to 16 kHz for capture
  audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
  playTime = audioCtx.currentTime;

  const blob = new Blob([WORKLET_SRC], { type: 'application/javascript' });
  const url  = URL.createObjectURL(blob);
  await audioCtx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);

  micSource  = audioCtx.createMediaStreamSource(micStream);
  workletNode = new AudioWorkletNode(audioCtx, 'capture-processor');

  workletNode.port.onmessage = (e) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const f32 = e.data;
    const i16 = new Int16Array(f32.length);
    for (let i = 0; i < f32.length; i++) {
      i16[i] = Math.max(-32768, Math.min(32767, Math.round(f32[i] * 32767)));
    }
    ws.send(i16.buffer);
  };

  micSource.connect(workletNode);
  // Don't connect to destination — we don't want mic playback

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    setStatus('Connected — speak now');
    btn.textContent = '⏹';
    btn.classList.add('active');
    btn.disabled = false;
  };

  ws.onclose = () => {
    setStatus('Disconnected');
    cleanup();
  };

  ws.onerror = () => {
    setStatus('Connection error');
    cleanup();
  };

  ws.onmessage = (e) => {
    if (typeof e.data === 'string') {
      handleJson(e.data);
    } else {
      playPcm(e.data);
    }
  };
}

function stop() {
  if (ws) ws.close();
  cleanup();
}

function cleanup() {
  if (workletNode) { workletNode.disconnect(); workletNode = null; }
  if (micSource)   { micSource.disconnect();   micSource = null; }
  if (micStream)   { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioCtx)    { audioCtx.close();         audioCtx = null; }
  ws = null;
  btn.textContent = '🎤';
  btn.classList.remove('active');
  btn.disabled = false;
  setStatus('Click to start');
}

function playPcm(buffer) {
  if (!audioCtx) return;
  const i16 = new Int16Array(buffer);
  if (!i16.length) return;

  const f32 = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;

  const abuf = audioCtx.createBuffer(1, f32.length, SAMPLE_RATE);
  abuf.getChannelData(0).set(f32);

  const src = audioCtx.createBufferSource();
  src.buffer = abuf;
  src.connect(audioCtx.destination);

  const now = audioCtx.currentTime;
  if (playTime < now) playTime = now;
  src.start(playTime);
  playTime += abuf.duration;
}

function handleJson(raw) {
  let msg;
  try { msg = JSON.parse(raw); } catch (_) { return; }

  if (msg.type === 'log') {
    appendLog(msg.msg);
  } else if (msg.type === 'transcript') {
    appendTranscript(msg.role, msg.text);
  }
}

function setStatus(msg) { statusEl.textContent = msg; }

function appendTranscript(role, text) {
  const row = document.createElement('div');
  row.className = 'turn ' + role;
  row.innerHTML = `<span class="role">${role === 'user' ? 'You' : 'AI'}:</span>`
                + `<span class="text">${escHtml(text)}</span>`;
  transcriptEl.appendChild(row);
  transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

function appendLog(msg) {
  const ts  = new Date().toTimeString().slice(0, 8);
  const cls = msg.startsWith('TTFC') ? 'ttfc'
            : msg.startsWith('RTF')  ? 'rtf'
            : msg.startsWith('STT')  ? 'stt'
            : msg.startsWith('LLM')  ? 'llm'
            : msg.startsWith('TTS')  ? 'tts'
            : '';
  const row = document.createElement('div');
  row.className = 'entry' + (cls ? ' ' + cls : '');
  row.innerHTML = `<span class="ts">${ts}</span>${escHtml(msg)}`;
  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
